[tools]
java = "temurin-21"
clojure = "1.12.6.1673"
clj-kondo = "2026.08.04"
cljstyle = "0.17.642"

[tasks.dev]
description = "Start the system with an nREPL server"
run = "clojure -X:dev"

[tasks.run]
description = "Run the app"
run = "clojure -M:run"

[tasks.test]
description = "Run tests"
run = "clojure -X:test"

[tasks.lint]
description = "Lint with clj-kondo"
run = "clj-kondo --lint src test dev build.clj"

[tasks.fmt]
description = "Format with cljstyle"
run = "cljstyle fix"

[tasks."fmt:check"]
description = "Check formatting with cljstyle"
run = "cljstyle check --report"

[tasks.build]
description = "Build the uberjar"
run = "clojure -T:build build"

[tasks.ci]
description = "Run all checks"
depends = ["lint", "fmt:check", "test"]
