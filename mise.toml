[tools]
java = "temurin-21"
clojure = "1.12.6.1673"
clj-kondo = "2026.08.04"
babashka = "1.13.225"

[tasks.dev]
description = "Start the system with an nREPL server"
run = "clojure -X:dev"

[tasks.run]
description = "Run the app"
run = "clojure -M:run"

[tasks.test]
description = "Run tests"
run = "clojure -X:test"

[tasks.lint]
description = "Lint with clj-kondo"
run = "clj-kondo --lint src test dev scripts build.clj"

[tasks.fmt]
description = "Format with cljfmt"
run = "clojure -M:fmt fix"

[tasks."fmt:check"]
description = "Check formatting with cljfmt"
run = "clojure -M:fmt check"

[tasks.build]
description = "Build the uberjar"
run = "clojure -T:build build"

[tasks.outdated]
description = "List outdated dependencies"
run = "clojure -M:outdated"

[tasks."outdated:upgrade"]
description = "Upgrade outdated dependencies"
run = "clojure -M:outdated --upgrade"

[tasks.rename]
description = "Rename the project, e.g. `mise run rename my-app`"
run = "bb scripts/rename.clj"

[tasks.ci]
description = "Run all checks"
depends = ["lint", "fmt:check", "test"]
